<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entwicklungsdienste</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #111827;
        color: #e5e7eb;
      }

      body {
        margin: 0;
        padding: 3rem 1.5rem;
      }

      main {
        max-width: 44rem;
        margin: auto;
      }

      h1 {
        margin: 0;
      }

      p {
        color: #9ca3af;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        gap: 1rem;
        padding: 0;
        list-style: none;
      }

      a {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.25rem;
        border: 1px solid #374151;
        border-radius: 0.5rem;
        background: #1f2937;
        color: #f9fafb;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: #60a5fa;
        background: #273449;
      }

      small {
        display: block;
        margin-top: 0.5rem;
        color: #9ca3af;
      }

      .icon {
        flex: 0 0 auto;
        width: 2.5rem;
        height: 2.5rem;
      }

      .icon path,
      .icon rect,
      .icon circle {
        stroke: currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Entwicklungsdienste</h1>
      <p>Lokale Weboberflaechen und API-Endpunkte der Docker-Entwicklungsumgebung.</p>
      <ul>
        <li>
          <a data-port="4097" href="#" target="_blank" rel="noopener noreferrer">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.75" aria-hidden="true"><path d="m5 4 5 8-5 8M13 20h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>OpenCode<small>Weboberflaeche</small></span>
          </a>
        </li>
        <li>
          <a data-port="20128" href="#" target="_blank" rel="noopener noreferrer">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m9 8 6 4-6 4Z" stroke-linejoin="round"/></svg>
            <span>OmniRoute<small>API-Endpunkt</small></span>
          </a>
        </li>
        <li>
          <a data-port="8082" href="#" target="_blank" rel="noopener noreferrer">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.75" aria-hidden="true"><path d="M5 3h10l4 4v14H5Z" stroke-linejoin="round"/><path d="M15 3v5h5M8 12h8M8 16h6" stroke-linecap="round"/></svg>
            <span>DocGen<small>Dokumentationsgenerator</small></span>
          </a>
        </li>
        <li>
          <a data-port="7682" href="#" target="_blank" rel="noopener noreferrer">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.75" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 10 3 2-3 2M13 16h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Codex<small>Webterminal, falls aktiviert</small></span>
          </a>
        </li>
        <li>
          <a data-port="7683" href="#" target="_blank" rel="noopener noreferrer">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.75" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 10 3 2-3 2M13 16h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Claude Code<small>Webterminal, falls aktiviert</small></span>
          </a>
        </li>
      </ul>
    </main>
    <script>
      for (const link of document.querySelectorAll("a[data-port]")) {
        link.href = `${window.location.protocol}//${window.location.hostname}:${link.dataset.port}`;
      }
    </script>
  </body>
</html>
