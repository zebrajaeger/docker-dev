services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NVM_VERSION: ${NVM_VERSION:-v0.40.3}
        NODE_VERSION: ${NODE_VERSION:-24}
        JAVA_VERSION: ${JAVA_VERSION:-21.0.12+1-sapmchn}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9.16}

    container_name: dev-environment

    volumes:
      - ..:/workspace
      - dev-ssh:/home/developer/.ssh
      - ${SSH_PUBLIC_KEY}:/ssh-host-key/authorized_key.pub:ro
      - ./opencode:/home/developer/.config/opencode:rw

    ports:
      - "${SSH_PORT:-2222}:22"
      - "4096:4096"
      - "7681:7681"
      - "8082:4082"

    restart: unless-stopped

volumes:
  dev-ssh:
