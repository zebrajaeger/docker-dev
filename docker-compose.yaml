services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NVM_VERSION: ${NVM_VERSION:-v0.40.3}
        NODE_VERSION: ${NODE_VERSION:-24}
        JAVA_VERSION: ${JAVA_VERSION:-21.0.12+1-sapmchn}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9.16}

    container_name: dev-environment

    volumes:
      - ${SSH_PUBLIC_KEY:-${USERPROFILE}/.ssh/docker-dev.pub}:/ssh-host-key/authorized_key.pub:ro
      - dev-ssh:/home/developer/.ssh
      - ..:/home/developer/ws
      - ./.config/omniroute:/home/developer/.omniroute
      - ./.config/opencode:/home/developer/.config/opencode
      - ./.config/codex:/home/developer/.codex
      - ./.config/claude:/home/developer/.claude

    ports:
      - "${SSH_PORT:-2222}:22"
      # OmniRoute
      - "20128:20128"
      # DocGen
      - "8082:4082"
      # OpenCode serve/web
      - "4097:4096"
      # ttyd ports
      - "7681:7681"
      - "7682:7682"
      - "7683:7683"
      # codebase-memory-mcp graph
      - "9749:9749"

    environment:
      START_OMNIROUTE: ${START_OMNIROUTE:-true}
      START_OPENCODE: ${START_OPENCODE:-true}
      START_CODEX: ${START_CODEX:-false}
      START_CLAUDE: ${START_CLAUDE:-false}

    restart: unless-stopped

volumes:
  dev-ssh:
