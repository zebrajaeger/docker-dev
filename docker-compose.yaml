services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NVM_VERSION: ${NVM_VERSION:-v0.40.3}
        NODE_VERSION: ${NODE_VERSION:-24}
        JAVA_VERSION: ${JAVA_VERSION:-21.0.12+1-sapmchn}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9.16}

    container_name: dev-environment

    volumes:
      - ${SSH_PUBLIC_KEY}:/ssh-host-key/authorized_key.pub:ro
      - dev-ssh:/home/developer/.ssh
      - ..:/workspace
      - ./.config/omniroute:/home/developer/.omniroute:rw
      - ./.config/opencode:/home/developer/.config/opencode:rw
      - ./.config/codex:/home/developer/.codex:rw
      - ./.config/claude:/home/developer/.claude:rw

    ports:
      - "${SSH_PORT:-2222}:22"
      # DocGen
      - "8082:4082"
      # OpenCode serve/web
      - "4096:4096"
      # ttyd ports
      - "7681:7681"
      - "7682:7682"
      - "7683:7683"
      # codebase-memory-mcp graph
      - "9749:9749"

    restart: unless-stopped

volumes:
  dev-ssh:
